# ==========================================
# A3 2.0 - Perfil de Desenvolvimento
# ==========================================

# Porta do servidor em ambiente de desenvolvimento
server.port=8080

# ==========================================
# BANCO DE DADOS - SQLite (Desenvolvimento)
# ==========================================

# SQLite em arquivo local (zero configuracao de SGBD)
spring.datasource.url=jdbc:sqlite:./a3-20-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE - Desenvolvimento
# ==========================================

# Atualiza o schema automaticamente (cuidado: nao usar em producao)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Timezone do Hibernate para Brasil
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ==========================================
# THYMELEAF - Desenvolvimento
# ==========================================

# Cache desabilitado para recarregar templates em tempo real
spring.thymeleaf.cache=false

# ==========================================
# DEVTOOLS
# ==========================================

# Reinicio automatico da aplicacao ao detectar mudancas
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ==========================================
# LOGGING - Desenvolvimento (Mais Verboso)
# ==========================================

# Nivel DEBUG para pacotes da aplicacao
logging.level.br.com.projetoA3=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logs de Spring Security (util para depurar autorizacoes)
logging.level.org.springframework.security=DEBUG

# ==========================================
# E-MAIL - Desenvolvimento
# ==========================================

# Em desenvolvimento, recomenda-se usar um servidor SMTP de teste
# como MailHog (localhost:1025) ou Mailtrap. Se nao houver servidor,
# os e-mails serao logados no console (fallback).

# Exemplo 1: MailHog (servidor local de teste)
# spring.mail.host=localhost
# spring.mail.port=1025
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=false
# spring.mail.properties.mail.smtp.starttls.enable=false

# Exemplo 2: Gmail (descomente e configure se quiser testar com e-mail real)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=seu-email-dev@gmail.com
# spring.mail.password=sua-senha-de-app
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# Configuracao padrao para desenvolvimento (sem servidor SMTP ativo)
# Os e-mails serao simulados no console pelo EmailService.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=true

# ==========================================
# UPLOAD DE ARQUIVOS - Desenvolvimento
# ==========================================

# Pasta local para armazenar anexos dos tickets em dev
a3.upload.dir=./uploads/dev/tickets/
a3.upload.allowed-extensions=jpg,jpeg,png,pdf,doc,docx,xls,xlsx,txt,zip

# ==========================================
# SEGURANCA - Desenvolvimento
# ==========================================

# Usuario padrao para testes rapidos (desativar em producao)
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ==========================================
# TIMEZONE E LOCALE
# ==========================================

# Forca Portugues do Brasil
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Timezone padrao
spring.jackson.time-zone=America/Sao_Paulo

# ==========================================
# CONFIGURACOES OPCIONAIS - PostgreSQL (Futuro)
# ==========================================


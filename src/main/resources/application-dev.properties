# =====================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO (PERFIL: dev)
# =====================================================

# THYMELEAF - Cache desabilitado para hot-reload de templates
spring.thymeleaf.cache=false

# JPA / HIBERNATE - Debug de Queries
# Exibe o SQL no console para monitorar performance e N+1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder=TRACE

# LOGGING - Nível detalhado para o pacote do projeto
logging.level.root=INFO
logging.level.br.com.projetoA3=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# SERVER - Porta padrão de desenvolvimento
server.port=8080
server.error.include-stacktrace=always
server.error.include-message=always

# H2 CONSOLE (Opcional, se decidir usar H2 em memória em algum momento do dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
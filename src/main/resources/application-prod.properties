# =====================================================
# CONFIGURAÇÕES DE PRODUÇÃO (PERFIL: prod)
# =====================================================

# THYMELEAF - Cache ativado para performance máxima
spring.thymeleaf.cache=true
spring.thymeleaf.check-template-location=true

# JPA / HIBERNATE
# Queries ocultas em produção por performance e segurança
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false

# LOGGING - Apenas erros e informações importantes
logging.level.root=WARN
logging.level.br.com.projetoA3=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# SERVER - Hardening de Erros
# ✅ SEGURANÇA: Nunca exibir stacktraces ou detalhes internos ao usuário final
server.port=80
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# CONFIGURAÇÕES DE DATABASE (Sobrescrita se necessário)

# ==========================================
# A3 2.0 - Perfil de Producao
# ==========================================
# ATENCAO: Este arquivo e usado em ambiente de producao.
# Nao habilite debug nem expose dados sensiveis.

# ==========================================
# SERVIDOR
# ==========================================

# Porta padrao de producao
server.port=8080

# Erros genericos (nao expoe stack trace ao usuario)
server.error.include-message=on-param
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# ==========================================
# BANCO DE DADOS - SQLite (Producao)
# ==========================================

# SQLite em arquivo local (recomenda-se backup diario)
spring.datasource.url=jdbc:sqlite:./a3_2_0.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Pool de conexoes otimizado para producao
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA / HIBERNATE - Producao
# ==========================================

# CUIDADO: 'update' cria/altera tabelas automaticamente.
# Para producao com schema estavel, considere 'validate' ou 'none'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=false

# Timezone do Hibernate para Brasil
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Desativa geracao automatica de estatisticas (performance)
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================================
# INICIALIZACAO DE DADOS
# ==========================================

# Desativa execucao automatica de scripts SQL externos
spring.sql.init.mode=never

# ==========================================
# H2 CONSOLE (Desativado em producao)
# ==========================================
spring.h2.console.enabled=false

# ==========================================
# THYMELEAF - Producao (Cache Habilitado)
# ==========================================

# Cache habilitado para melhor performance
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================================
# LOGGING - Producao (Menos Verboso)
# ==========================================

# Apenas WARN e ERROR para frameworks
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN

# INFO para a aplicacao
logging.level.br.com.projetoA3=INFO

# Padrao de log enxuto
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Arquivo de log rotativo (descomente se necessario)
# logging.file.name=logs/a3-20-prod.log
# logging.logback.rollingpolicy.max-file-size=10MB
# logging.logback.rollingpolicy.max-history=30

# ==========================================
# E-MAIL - Producao (Obrigatorio)
# ==========================================

# Configure obrigatoriamente com o servidor SMTP da sua empresa.
# Nunca commite senhas reais neste arquivo. Use variaveis de ambiente
# ou application-secrets.properties fora do versionamento.

# Exemplo Gmail (substitua pelos dados reais):
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:seu-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:sua-senha-de-app}

# Autenticacao TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts robustos para producao
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Encoding e remetente
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.from=A3-2.0 Sistema de Help Desk

# Debug desligado em producao
spring.mail.properties.mail.debug=false

# ==========================================
# E-MAIL ASSINCRONO - Producao
# ==========================================

# Pool maior para producao (mais usuarios = mais notificacoes)
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.pool.keep-alive=120s
spring.task.execution.thread-name-prefix=email-prod-

# ==========================================
# UPLOAD DE ARQUIVOS - Producao
# ==========================================

# Limite de 10MB para anexos de tickets
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Pasta de uploads em producao (use caminho absoluto fora do projeto)
a3.upload.dir=./uploads/tickets/
a3.upload.allowed-extensions=jpg,jpeg,png,pdf,doc,docx,xls,xlsx,txt,zip

# ==========================================
# SEGURANCA - Producao
# ==========================================

# Desativa usuario padrao em producao (use banco de dados)
# spring.security.user.name=
# spring.security.user.password=
# spring.security.user.roles=

# Sessao mais segura
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ==========================================
# TIMEZONE E LOCALE
# ==========================================

# Forca Portugues do Brasil
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Timezone padrao
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ==========================================
# DEVTOOLS (Desativado em Producao)
# ==========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ==========================================
# INTERNACIONALIZACAO
# ==========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
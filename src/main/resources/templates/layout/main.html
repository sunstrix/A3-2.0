<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - A3-2.0 Help Desk">A3-2.0</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/estilos-custom.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-headset me-2 fs-4"></i> A3-2.0
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    
                    <!-- Links do Projeto Original (Preservados) -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/projetos}"><i class="bi bi-folder-fill"></i> Projetos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/equipes}"><i class="bi bi-people-fill"></i> Equipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/kanban}"><i class="bi bi-kanban-fill"></i> Kanban</a>
                    </li>
                    
                    <!-- Divisor Visual -->
                    <li class="nav-item mx-2 d-none d-lg-block">
                        <span class="nav-link text-white-50">|</span>
                    </li>

                    <!-- Novos Links do Modulo Help Desk -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tickets}"><i class="bi bi-ticket-detailed"></i> Chamados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/base-conhecimento}"><i class="bi bi-book-half"></i> Base de Conhecimento</a>
                    </li>
                </ul>
                
                <!-- Menu do Usuario (Spring Security) -->
                <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2 fs-5"></i>
                            <span sec:authentication="name">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li><a class="dropdown-item" th:href="@{/perfil}"><i class="bi bi-person-gear me-2"></i> Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i> Sair
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Container Principal de Conteudo -->
    <main class="flex-grow-1 container-fluid py-4">
        <!-- Mensagens Flash (Sucesso / Erro) -->
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${mensagemSucesso}">Sucesso</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${mensagemErro}">Erro</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Fragmento onde as paginas filhas injetarao seu conteudo especifico -->
        <section layout:fragment="content">
            <p class="text-muted text-center mt-5">Carregando conteúdo...</p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container-fluid text-center text-muted small">
            &copy; 2026 <strong>A3-2.0 Help Desk & Gestão</strong>. Todos os direitos reservados.
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

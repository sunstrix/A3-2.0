<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A3-2.0 - Sistema de Help Desk e Gestao de Projetos">
    <meta name="theme-color" content="#0d6efd">
    <title layout:title-pattern="$CONTENT_TITLE - A3-2.0">A3-2.0</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-custom.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
</head>
<body class="d-flex flex-column min-vh-100" data-bs-theme="light">

    <!-- Navbar Superior -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <!-- Breadcrumbs -->
    <nav aria-label="navegacao" class="bg-body-tertiary border-bottom py-2" th:if="${tituloPagina != null}">
        <div class="container-fluid">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a th:href="@{/menu}" class="text-decoration-none"><i class="bi bi-house-door"></i> Inicio</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${tituloPagina}">Pagina</li>
            </ol>
        </div>
    </nav>

    <!-- Container Principal de Conteudo -->
    <main class="flex-grow-1 container-fluid py-4">
        
        <!-- Toast Container para Notificacoes -->
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1050;">
            <div th:if="${mensagemSucesso}" class="toast align-items-center text-bg-success border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${mensagemSucesso}">Sucesso</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>
            <div th:if="${mensagemErro}" class="toast align-items-center text-bg-danger border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="8000">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${mensagemErro}">Erro</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>
            <div th:if="${mensagemInfo}" class="toast align-items-center text-bg-info border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span th:text="${mensagemInfo}">Informacao</span>
                    </div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>
        </div>

        <!-- Alertas Flash (Fallback para compatibilidade) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${sucesso}">Sucesso</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${erro}">Erro</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex justify-content-center align-items-center" style="z-index: 1040;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>

        <!-- Fragmento onde as paginas filhas injetarao seu conteudo especifico -->
        <section layout:fragment="content">
            <div class="text-center mt-5 text-muted">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Carregando conteudo...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Theme Toggle (Floating Button) -->
    <div th:replace="~{common/theme-toggle :: theme-toggle}"></div>

    <!-- Bootstrap 5.3 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/ux.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    
    <!-- Inicializacao de Toasts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'));
            var toastList = toastElList.map(function(toastEl) {
                return new bootstrap.Toast(toastEl);
            });
            toastList.forEach(function(toast) {
                toast.show();
            });
        });
    </script>
</body>
</html>

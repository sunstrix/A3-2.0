<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body { background-color: var(--bg-secondary) !important; color: var(--text-primary); }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .stat-card {
            background-color: var(--bg-primary) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        /* Estilização da Tabela para eliminar o branco de vez */
        .card-table {
            background-color: var(--bg-primary) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px;
            overflow: hidden;
        }
        .table { color: var(--text-primary) !important; background-color: transparent !important; }
        .table thead th {
            background-color: var(--bg-tertiary) !important;
            color: var(--text-secondary) !important;
            border-bottom: 2px solid var(--border-color) !important;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 1.2rem 1rem;
        }
        .table tbody td { 
            background-color: var(--bg-primary) !important; 
            color: var(--text-primary) !important;
            border-bottom: 1px solid var(--border-color) !important;
            padding: 1rem;
        }
        
        /* Badges customizadas para evitar o efeito esbranquiçado do Bootstrap subtle */
        .status-ativo {
            background-color: rgba(16, 185, 129, 0.15) !important;
            color: #10b981 !important;
            border: 1px solid rgba(16, 185, 129, 0.3) !important;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-inativo {
            background-color: rgba(148, 163, 184, 0.15) !important;
            color: #94a3b8 !important;
            border: 1px solid rgba(148, 163, 184, 0.3) !important;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4 fade-in">
        
        <!-- Mensagens Flash -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i>Gestão de Usuários</h2>
                <p style="color: var(--text-secondary);" class="mb-0">Controle de acessos e perfis da plataforma</p>
            </div>
            <a href="/usuarios/novo" class="btn btn-primary px-4">
                <i class="bi bi-person-plus-fill me-2"></i>Novo Usuário
            </a>
        </div>

        <!-- Cards de Estatísticas -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-people fs-2 text-primary me-3"></i>
                        <div>
                            <div class="fs-4 fw-bold" th:text="${totalUsuarios}">0</div>
                            <div class="small text-muted text-uppercase fw-semibold">Cadastrados</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-shield-check fs-2 text-success me-3"></i>
                        <div>
                            <div class="fs-4 fw-bold" th:text="${totalAtivos}">0</div>
                            <div class="small text-muted text-uppercase fw-semibold">Ativos</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-person-x fs-2 text-warning me-3"></i>
                        <div>
                            <div class="fs-4 fw-bold" th:text="${totalUsuarios - totalAtivos}">0</div>
                            <div class="small text-muted text-uppercase fw-semibold">Inativos</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="card-table shadow-lg mb-5">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th class="ps-4">Identificação</th>
                            <th>E-mail</th>
                            <th>Cargo</th>
                            <th>Acesso</th>
                            <th class="text-center">Status</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="user-avatar" th:text="${usuario.nome != null ? usuario.nome.substring(0,1).toUpperCase() : '?'}">U</div>
                                    <div>
                                        <div class="fw-bold" th:text="${usuario.nome}">Nome</div>
                                        <small style="color: var(--text-muted);" th:text="'@' + ${usuario.login}"></small>
                                    </div>
                                </div>
                            </td>
                            <td><a th:href="'mailto:' + ${usuario.email}" class="text-decoration-none small" style="color: var(--info);" th:text="${usuario.email}"></a></td>
                            <td th:text="${usuario.cargo}" class="small" style="color: var(--text-secondary);"></td>
                            <td>
                                <span class="badge" 
                                      th:styleappend="${usuario.perfil?.name() == 'ADMINISTRADOR'} ? 'background-color: var(--danger);' : 'background-color: var(--primary);'"
                                      th:text="${usuario.perfil?.name()}"></span>
                            </td>
                            <td class="text-center">
                                <span th:if="${usuario.ativo}" class="status-ativo">Ativo</span>
                                <span th:unless="${usuario.ativo}" class="status-inativo">Inativo</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/usuarios/toggle-ativo/{id}(id=${usuario.id})}" class="btn btn-outline-warning" title="Alternar Status"><i class="bi bi-power"></i></a>
                                    <a th:href="@{/usuarios/deletar/{id}(id=${usuario.id})}" class="btn btn-outline-danger" onclick="return confirm('Excluir usuário?')"><i class="bi bi-trash3"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

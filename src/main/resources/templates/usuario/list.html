<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="#{user.title}">Usuarios - A3 2.0</title>
    <style>
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
        }
        .stat-card {
            background-color: var(--bg-primary) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .status-ativo {
            background-color: rgba(16, 185, 129, 0.15) !important;
            color: #10b981 !important;
            border: 1px solid rgba(16, 185, 129, 0.3) !important;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-inativo {
            background-color: rgba(148, 163, 184, 0.15) !important;
            color: #94a3b8 !important;
            border: 1px solid rgba(148, 163, 184, 0.3) !important;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <section layout:fragment="content">
        <div class="container mb-5">
            
            <!-- Cabecalho -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i><span th:text="#{user.title}">Gestao de Usuarios</span></h2>
                    <p class="text-muted mb-0 small" th:text="#{app.pagination.showing}">Controle de acessos e perfis da plataforma</p>
                </div>
                <a th:href="@{/usuarios/novo}" class="btn btn-primary px-4">
                    <i class="bi bi-person-plus-fill me-2"></i><span th:text="#{user.new}">Novo Usuario</span>
                </a>
            </div>

            <!-- Cards de Estatisticas -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center">
                            <i class="bi bi-people fs-2 text-primary me-3"></i>
                            <div>
                                <div class="fs-4 fw-bold" th:text="${totalUsuarios} ?: 0">0</div>
                                <div class="small text-muted text-uppercase fw-semibold">Cadastrados</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center">
                            <i class="bi bi-shield-check fs-2 text-success me-3"></i>
                            <div>
                                <div class="fs-4 fw-bold" th:text="${totalAtivos} ?: 0">0</div>
                                <div class="small text-muted text-uppercase fw-semibold">Ativos</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center">
                            <i class="bi bi-person-x fs-2 text-warning me-3"></i>
                            <div>
                                <div class="fs-4 fw-bold" th:text="(${totalUsuarios} ?: 0) - (${totalAtivos} ?: 0)">0</div>
                                <div class="small text-muted text-uppercase fw-semibold">Inativos</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Busca -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/usuarios}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small text-muted">Buscar</label>
                            <input type="text" name="termo" class="form-control form-control-sm" 
                                   placeholder="Nome, login ou e-mail..." th:value="${param.termo}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Perfil</label>
                            <select name="perfil" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="ADMINISTRADOR" th:selected="${param.perfil == 'ADMINISTRADOR'}">Administrador</option>
                                <option value="GERENTE" th:selected="${param.perfil == 'GERENTE'}">Gerente</option>
                                <option value="ATENDENTE" th:selected="${param.perfil == 'ATENDENTE'}">Atendente</option>
                                <option value="COLABORADOR" th:selected="${param.perfil == 'COLABORADOR'}">Colaborador</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Status</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="ativo" th:selected="${param.status == 'ativo'}">Ativo</option>
                                <option value="inativo" th:selected="${param.status == 'inativo'}">Inativo</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-funnel me-1"></i> Filtrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabela -->
            <div class="card shadow-sm border-0 mb-5">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr class="text-muted small text-uppercase">
                                <th class="ps-4">Identificacao</th>
                                <th>E-mail</th>
                                <th>Cargo</th>
                                <th>Acesso</th>
                                <th class="text-center">Status</th>
                                <th class="text-end pe-4">Acoes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="user-avatar" th:text="${usuario.iniciais}">U</div>
                                        <div>
                                            <div class="fw-bold" th:text="${usuario.nome}">Nome</div>
                                            <small class="text-muted" th:text="'@' + ${usuario.login}">@login</small>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <a th:href="'mailto:' + ${usuario.email}" class="text-decoration-none small" th:text="${usuario.email}">email</a>
                                    <div class="small text-muted" th:if="${usuario.telefone != null}" th:text="${usuario.telefone}">tel</div>
                                </td>
                                <td class="small text-muted" th:text="${usuario.cargo}">Cargo</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${
                                            usuario.perfil?.name() == 'ADMINISTRADOR' ? 'bg-danger' :
                                            usuario.perfil?.name() == 'GERENTE' ? 'bg-info text-dark' :
                                            usuario.perfil?.name() == 'ATENDENTE' ? 'bg-success' : 'bg-secondary'
                                          }"
                                          th:text="${usuario.perfil?.descricao}">Perfil</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${usuario.ativo}" class="status-ativo">
                                        <i class="bi bi-check-circle me-1"></i>Ativo
                                    </span>
                                    <span th:unless="${usuario.ativo}" class="status-inativo">
                                        <i class="bi bi-x-circle me-1"></i>Inativo
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-outline-primary" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/usuarios/toggle-ativo/{id}(id=${usuario.id})}" class="btn btn-outline-warning" title="Alternar Status">
                                            <i class="bi bi-power"></i>
                                        </a>
                                        <a th:href="@{/usuarios/deletar/{id}(id=${usuario.id})}" class="btn btn-outline-danger" 
                                           th:onclick="'return confirm(\'' + #{app.delete.confirm} + '\')'">
                                            <i class="bi bi-trash3"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-search fs-1 d-block mb-2"></i>
                                    Nenhum usuario encontrado.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

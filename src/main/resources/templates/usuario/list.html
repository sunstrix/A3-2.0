<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body { background-color: var(--bg-secondary); color: var(--text-primary); }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
        }
        .stat-card {
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .table { color: var(--text-primary); }
        .table-hover tbody tr:hover {
            background-color: rgba(99, 102, 241, 0.1) !important;
        }
        .btn-action {
            padding: 0.3rem 0.6rem;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .card-table {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Navbar Global -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4 fade-in">
        
        <!-- Mensagens Flash -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert" style="background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid var(--danger);">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-people-fill" style="color: var(--primary);"></i> Gestão de Usuários
                </h2>
                <p style="color: var(--text-secondary);" class="mb-0">Administração de contas e permissões de acesso</p>
            </div>
            <a href="/usuarios/novo" class="btn btn-primary">
                <i class="bi bi-person-plus-fill me-1"></i> Novo Usuário
            </a>
        </div>

        <!-- Cards de Estatísticas -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card text-white shadow-sm" style="background-color: var(--primary);">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-people-fill fs-1 me-3 opacity-75"></i>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${totalUsuarios}">0</div>
                            <div class="small opacity-75">Total de Usuários</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white shadow-sm" style="background-color: var(--success);">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-person-check-fill fs-1 me-3 opacity-75"></i>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${totalAtivos}">0</div>
                            <div class="small opacity-75">Usuários Ativos</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-dark shadow-sm" style="background-color: var(--warning);">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-person-x-fill fs-1 me-3 opacity-75"></i>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${totalUsuarios - totalAtivos}">0</div>
                            <div class="small opacity-75">Usuários Inativos</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Usuários -->
        <div class="card-table shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead>
                            <tr style="background-color: var(--bg-tertiary); border-bottom: 2px solid var(--border-color);">
                                <th class="ps-4" style="color: var(--text-secondary);">Usuário</th>
                                <th style="color: var(--text-secondary);">E-mail</th>
                                <th style="color: var(--text-secondary);">Cargo</th>
                                <th style="color: var(--text-secondary);">Perfil</th>
                                <th class="text-center" style="color: var(--text-secondary);">Status</th>
                                <th class="text-center pe-4" style="color: var(--text-secondary);">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="6" class="text-center py-5" style="color: var(--text-muted);">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    Nenhum usuário cadastrado ainda.
                                </td>
                            </tr>
                            <tr th:each="usuario : ${usuarios}" style="border-bottom: 1px solid var(--border-color);">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="user-avatar" 
                                             th:text="${usuario.nome != null ? usuario.nome.substring(0,1).toUpperCase() : '?'}">A</div>
                                        <div>
                                            <div class="fw-semibold" th:text="${usuario.nome}" style="color: var(--text-primary);">Nome</div>
                                            <small style="color: var(--text-muted);" th:text="'@' + ${usuario.login}">login</small>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <a th:href="'mailto:' + ${usuario.email}" class="text-decoration-none" style="color: var(--info);" th:text="${usuario.email}">email</a>
                                </td>
                                <td th:text="${usuario.cargo ?: '-'}" style="color: var(--text-secondary);">Cargo</td>
                                <td>
                                    <span class="badge"
                                          th:styleappend="${usuario.perfil?.name() == 'ADMINISTRADOR'} ? 'background-color: var(--danger);' : 
                                                         (${usuario.perfil?.name() == 'GERENTE'} ? 'background-color: var(--primary);' : 'background-color: var(--text-muted);')"
                                          th:text="${usuario.perfil?.name() ?: '-'}">PERFIL</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${usuario.ativo != null and usuario.ativo}" 
                                          class="badge" style="background-color: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success);">
                                        <i class="bi bi-check-circle-fill me-1"></i> Ativo
                                    </span>
                                    <span th:unless="${usuario.ativo != null and usuario.ativo}" 
                                          class="badge" style="background-color: rgba(100, 116, 139, 0.1); color: var(--text-muted); border: 1px solid var(--border-color);">
                                        <i class="bi bi-x-circle-fill me-1"></i> Inativo
                                    </span>
                                </td>
                                <td class="text-center pe-4">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" 
                                           class="btn btn-outline-primary btn-action" title="Editar">
                                            <i class="bi bi-pencil-fill"></i>
                                        </a>
                                        <a th:href="@{/usuarios/toggle-ativo/{id}(id=${usuario.id})}" 
                                           class="btn btn-action"
                                           th:classappend="${usuario.ativo != null and usuario.ativo} ? 'btn-outline-warning' : 'btn-outline-success'"
                                           th:title="${usuario.ativo != null and usuario.ativo} ? 'Desativar' : 'Ativar'">
                                            <i th:class="${usuario.ativo != null and usuario.ativo} ? 'bi bi-person-dash-fill' : 'bi bi-person-check-fill'"></i>
                                        </a>
                                        <a th:href="@{/usuarios/deletar/{id}(id=${usuario.id})}" 
                                           class="btn btn-outline-danger btn-action"
                                           title="Remover"
                                           onclick="return confirm('Tem certeza que deseja remover este usuário?');">
                                            <i class="bi bi-trash-fill"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer Global -->
    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ux.js"></script>
</body>
</html>

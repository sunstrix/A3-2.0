<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body { background-color: var(--bg-secondary); color: var(--text-primary); }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
        }

        /* Estilo Sênior para os Cards de Estatística */
        .stat-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .stat-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Polimento da Tabela */
        .card-table {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .table { color: var(--text-primary); margin-bottom: 0; }
        .table thead th {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 1rem;
        }
        .table tbody td { padding: 1rem; border-bottom: 1px solid var(--border-color); }
        .table-hover tbody tr:hover {
            background-color: rgba(99, 102, 241, 0.05) !important;
        }

        .btn-action {
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

    <!-- Navbar Global -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4 fade-in">
        
        <!-- Mensagens Flash -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-people-fill text-primary me-2"></i>Gestão de Usuários
                </h2>
                <p style="color: var(--text-secondary);" class="mb-0 small">Controle de acessos e perfis da plataforma</p>
            </div>
            <a href="/usuarios/novo" class="btn btn-primary shadow-sm px-4">
                <i class="bi bi-person-plus-fill me-2"></i>Novo Usuário
            </a>
        </div>

        <!-- Cards de Estatísticas Polidos -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon-wrapper me-3" style="background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold" th:text="${totalUsuarios}" style="color: var(--text-primary);">0</div>
                            <div class="small text-uppercase fw-semibold" style="color: var(--text-muted);">Total de Contas</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon-wrapper me-3" style="background: rgba(16, 185, 129, 0.1); color: var(--success);">
                            <i class="bi bi-shield-check"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold" th:text="${totalAtivos}" style="color: var(--text-primary);">0</div>
                            <div class="small text-uppercase fw-semibold" style="color: var(--text-muted);">Usuários Ativos</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon-wrapper me-3" style="background: rgba(245, 158, 11, 0.1); color: var(--warning);">
                            <i class="bi bi-person-x"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold" th:text="${totalUsuarios - totalAtivos}" style="color: var(--text-primary);">0</div>
                            <div class="small text-uppercase fw-semibold" style="color: var(--text-muted);">Inativos</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Usuários -->
        <div class="card-table shadow-sm mb-5">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th class="ps-4">Perfil / Login</th>
                            <th>E-mail</th>
                            <th>Cargo</th>
                            <th>Acesso</th>
                            <th class="text-center">Status</th>
                            <th class="text-center pe-4">Gerenciar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center py-5" style="color: var(--text-muted);">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Nenhum usuário encontrado.
                            </td>
                        </tr>
                        <tr th:each="usuario : ${usuarios}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="user-avatar" 
                                         th:text="${usuario.nome != null ? usuario.nome.substring(0,1).toUpperCase() : '?'}">A</div>
                                    <div>
                                        <div class="fw-bold" th:text="${usuario.nome}" style="color: var(--text-primary);">Nome</div>
                                        <small style="color: var(--text-muted);" th:text="'@' + ${usuario.login}">login</small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <a th:href="'mailto:' + ${usuario.email}" class="text-decoration-none small" style="color: var(--info);" th:text="${usuario.email}">email</a>
                            </td>
                            <td class="small" th:text="${usuario.cargo ?: '-'}">Cargo</td>
                            <td>
                                <span class="badge"
                                      th:styleappend="${usuario.perfil?.name() == 'ADMINISTRADOR'} ? 'background-color: var(--danger);' : 
                                                     (${usuario.perfil?.name() == 'GERENTE'} ? 'background-color: var(--primary);' : 'background-color: var(--text-muted);')"
                                      th:text="${usuario.perfil?.name() ?: '-'}">PERFIL</span>
                            </td>
                            <td class="text-center">
                                <span th:if="${usuario.ativo}" 
                                      class="badge" style="background-color: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success);">
                                    Ativo
                                </span>
                                <span th:unless="${usuario.ativo}" 
                                      class="badge" style="background-color: rgba(100, 116, 139, 0.1); color: var(--text-muted); border: 1px solid var(--border-color);">
                                    Inativo
                                </span>
                            </td>
                            <td class="text-center pe-4">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" 
                                       class="btn btn-outline-primary btn-action" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/usuarios/toggle-ativo/{id}(id=${usuario.id})}" 
                                       class="btn btn-action"
                                       th:classappend="${usuario.ativo} ? 'btn-outline-warning' : 'btn-outline-success'"
                                       th:title="${usuario.ativo} ? 'Desativar Conta' : 'Reativar Conta'">
                                        <i th:class="${usuario.ativo} ? 'bi bi-person-dash' : 'bi bi-person-check'"></i>
                                    </a>
                                    <a th:href="@{/usuarios/deletar/{id}(id=${usuario.id})}" 
                                       class="btn btn-outline-danger btn-action"
                                       title="Remover permanentemente"
                                       onclick="return confirm('ATENÇÃO: Esta ação não pode ser desfeita. Excluir usuário?');">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

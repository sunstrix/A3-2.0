<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .project-card {
            transition: all 0.2s ease;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 100%;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .project-status {
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-weight: 600;
            color: white;
        }
        .stat-card {
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body style="background-color: var(--bg-secondary); color: var(--text-primary);">

    <!-- Navbar Global -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4 fade-in">
        
        <!-- Mensagens Flash -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert" style="background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid var(--danger);">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-folder-fill" style="color: var(--primary);"></i> Gestão de Projetos
                </h2>
                <p style="color: var(--text-secondary);" class="mb-0">Gerencie todos os projetos da organização</p>
            </div>
            <a href="/projetos/novo" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Novo Projeto
            </a>
        </div>

        <!-- Cards de Estatísticas -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card text-white shadow-sm" style="background-color: var(--primary);">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-folder-fill fs-1 me-3 opacity-75"></i>
                        <div>
                            <div class="fs-3 fw-bold" th:text="${#lists.size(projetos)}">0</div>
                            <div class="small opacity-75">Total de Projetos</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white shadow-sm" style="background-color: var(--success);">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-check-circle-fill fs-1 me-3 opacity-75"></i>
                        <div>
                            <div class="fs-3 fw-bold" 
                                 th:text="${#lists.size(projetos.?[status.name() == 'CONCLUIDO'])}">0</div>
                            <div class="small opacity-75">Projetos Concluídos</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white shadow-sm" style="background-color: var(--info);">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-play-circle-fill fs-1 me-3 opacity-75"></i>
                        <div>
                            <div class="fs-3 fw-bold" 
                                 th:text="${#lists.size(projetos.?[status.name() == 'EM_ANDAMENTO'])}">0</div>
                            <div class="small opacity-75">Em Andamento</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Grid de Projetos -->
        <div class="row g-4">
            <div th:if="${#lists.isEmpty(projetos)}" class="col-12">
                <div class="text-center py-5" style="background-color: var(--bg-primary); border: 1px dashed var(--border-color); border-radius: 12px;">
                    <i class="bi bi-inbox fs-1 d-block mb-2" style="color: var(--text-muted);"></i>
                    <h5 style="color: var(--text-primary);">Nenhum projeto cadastrado ainda</h5>
                    <p style="color: var(--text-secondary);" class="mb-0">Clique em "Novo Projeto" para começar.</p>
                </div>
            </div>

            <div th:each="projeto : ${projetos}" class="col-md-6 col-lg-4">
                <div class="card project-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0" th:text="${projeto.nome}" style="color: var(--text-primary);">Nome do Projeto</h5>
                            <span class="project-status"
                                  th:classappend="${projeto.status.name() == 'PLANEJAMENTO' ? 'bg-secondary' : 
                                                   (projeto.status.name() == 'EM_ANDAMENTO' ? 'bg-primary' : 
                                                   (projeto.status.name() == 'CONCLUIDO' ? 'bg-success' : 'bg-danger'))}"
                                  th:text="${projeto.status.name()}">STATUS</span>
                        </div>
                        
                        <p class="small mb-3" style="color: var(--text-secondary);" 
                           th:text="${projeto.descricao != null ? #strings.abbreviate(projeto.descricao, 100) : 'Sem descrição'}">
                            Descrição do projeto...
                        </p>

                        <div class="mb-3">
                            <small class="d-block mb-1" style="color: var(--text-muted);">
                                <i class="bi bi-calendar-event me-1"></i>
                                <span th:text="${projeto.dataInicio != null ? #temporals.format(projeto.dataInicio, 'dd/MM/yyyy') : '-'}"></span>
                                <span th:if="${projeto.dataTerminoPrevista != null}">
                                    até <span th:text="${#temporals.format(projeto.dataTerminoPrevista, 'dd/MM/yyyy')}"></span>
                                </span>
                            </small>
                            <small class="d-block" style="color: var(--text-muted);">
                                <i class="bi bi-people-fill me-1"></i>
                                <span th:text="${projeto.equipe != null ? projeto.equipe.nome : 'Sem equipe'}">Equipe</span>
                            </small>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:href="@{/tarefas/kanban/{id}(id=${projeto.id})}" 
                               class="btn btn-sm btn-outline-primary flex-fill" title="Kanban">
                                <i class="bi bi-kanban-fill"></i> Kanban
                            </a>
                            <a th:href="@{/projetos/editar/{id}(id=${projeto.id})}" 
                               class="btn btn-sm btn-outline-warning" title="Editar">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <form th:action="@{/projetos/deletar/{id}(id=${projeto.id})}" method="get" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" 
                                        onclick="return confirm('Tem certeza que deseja remover este projeto?');">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer Global -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Botão de Tema -->
    <div th:replace="~{common/theme-toggle :: toggle}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ux.js"></script>
</body>
</html>

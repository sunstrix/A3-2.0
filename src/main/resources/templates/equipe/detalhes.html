<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detalhes da Equipe: ' + ${equipe.nome}">Detalhes da Equipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body { background-color: var(--bg-secondary); color: var(--text-primary); }
        .page-header { 
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%); 
            color: white; 
            padding: 1.5rem 0; 
            margin-bottom: 2rem; 
            border-radius: 0 0 12px 12px;
            box-shadow: var(--shadow-md);
        }
        .card-custom { 
            background-color: var(--bg-primary); 
            padding: 1.5rem; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md); 
            margin-bottom: 1.5rem; 
        }
        .membro-card { 
            border-left: 4px solid var(--primary); 
            background-color: var(--bg-tertiary); 
            padding: 1rem; 
            margin-bottom: 0.75rem; 
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .membro-card:hover { transform: translateX(5px); }
        .funcao-badge { 
            background-color: var(--primary); 
            color: white; 
            padding: 0.25rem 0.75rem; 
            border-radius: 20px; 
            font-size: 0.85rem; 
        }
        .navbar-custom {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .form-label { color: var(--text-secondary); font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/equipes" style="color: var(--primary);">
                <i class="bi bi-arrow-left-circle me-1"></i> Voltar para Equipes
            </a>
        </div>
    </nav>

    <div class="container fade-in">
        <div class="page-header px-4 d-flex justify-content-between align-items-center">
            <h2 class="mb-0 fw-bold"><i class="bi bi-people-fill me-2"></i><span th:text="${equipe.nome}">Nome da Equipe</span></h2>
            <a th:href="@{/equipes/editar/{id}(id=${equipe.id})}" class="btn btn-light fw-semibold" style="color: var(--primary);">
                <i class="bi bi-pencil-square me-1"></i> Editar Equipe
            </a>
        </div>

        <!-- Mensagens de Feedback -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert" style="background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid var(--danger);">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- Informações da Equipe -->
            <div class="col-lg-4">
                <div class="card-custom">
                    <h5 class="mb-4 fw-bold border-bottom pb-2" style="color: var(--text-primary);">
                        <i class="bi bi-info-circle me-2 text-primary"></i> Informações
                    </h5>
                    <div class="mb-3">
                        <small class="text-uppercase fw-bold text-muted d-block mb-1">Líder Responsável</small>
                        <p class="mb-0 fw-semibold" th:text="${equipe.lider?.nome ?: 'Não definido'}"></p>
                    </div>
                    <div class="mb-3">
                        <small class="text-uppercase fw-bold text-muted d-block mb-1">Tamanho do Time</small>
                        <span class="badge" style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--primary);">
                            <i class="bi bi-person-fill me-1"></i> <span th:text="${#lists.size(membros)}">0</span> membro(s)
                        </span>
                    </div>
                    <div th:if="${equipe.descricao}">
                        <small class="text-uppercase fw-bold text-muted d-block mb-1">Descrição</small>
                        <p class="mb-0 small text-secondary" th:text="${equipe.descricao}"></p>
                    </div>
                </div>
            </div>

            <!-- Gestão de Membros -->
            <div class="col-lg-8">
                <!-- Adicionar Novo Membro -->
                <div class="card-custom">
                    <h5 class="mb-4 fw-bold" style="color: var(--text-primary);"><i class="bi bi-person-plus me-2 text-success"></i> Adicionar Membro</h5>
                    <form th:action="@{/equipes/{id}/adicionar-membro(id=${equipe.id})}" method="post" class="row g-3">
                        <div class="col-md-5">
                            <label for="usuarioId" class="form-label">Colaborador</label>
                            <select class="form-select" id="usuarioId" name="usuarioId" required>
                                <option value="">Selecione...</option>
                                <option th:each="user : ${usuariosDisponiveis}" 
                                        th:value="${user.id}" 
                                        th:text="${user.nome} + ' - ' + ${user.cargo}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label for="funcao" class="form-label">Função na Equipe</label>
                            <input type="text" class="form-control" id="funcao" name="funcao" 
                                   placeholder="Ex: Desenvolvedor, Designer..." required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Lista de Membros -->
                <div class="card-custom">
                    <h5 class="mb-4 fw-bold" style="color: var(--text-primary);"><i class="bi bi-people me-2 text-info"></i> Membros Atuais</h5>
                    
                    <div th:if="${#lists.isEmpty(membros)}" class="text-center py-5" style="border: 1px dashed var(--border-color); border-radius: 8px;">
                        <i class="bi bi-people fs-1 text-muted"></i>
                        <p class="mt-2 mb-0 text-secondary">Nenhum membro adicionado ainda.</p>
                    </div>

                    <div th:each="membro : ${membros}" class="membro-card d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1 fw-bold" th:text="${membro.usuario.nome}">Nome do Membro</h6>
                            <p class="mb-0 text-muted small"><i class="bi bi-briefcase me-1"></i> [[${membro.usuario.cargo}]]</p>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="funcao-badge shadow-sm" th:text="${membro.funcao}">Função</span>
                            <a th:href="@{/equipes/{equipeId}/remover-membro/{membroId}(equipeId=${equipe.id}, membroId=${membro.id})}" 
                               class="btn btn-sm btn-outline-danger border-0"
                               title="Remover da equipe"
                               onclick="return confirm('Remover este membro da equipe?');">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="'Equipe: ' + ${equipe.nome}">Detalhes da Equipe</title>
    <style>
        .membro-card { 
            border-left: 4px solid var(--primary); 
            background-color: var(--bg-tertiary); 
            padding: 1rem; 
            margin-bottom: 0.75rem; 
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .membro-card:hover { transform: translateX(5px); }
        .funcao-badge { 
            background-color: var(--primary); 
            color: white; 
            padding: 0.25rem 0.75rem; 
            border-radius: 20px; 
            font-size: 0.85rem; 
        }
        .avatar-membro {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white; display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <section layout:fragment="content">
        <div class="container mb-5">
            <!-- Cabecalho -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-people-fill text-primary me-2"></i>
                        <span th:text="${equipe.nome}">Nome da Equipe</span>
                    </h2>
                    <p class="text-muted mb-0 small" th:text="'ID: #' + ${equipe.id}">ID: #0</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/equipes/editar/{id}(id=${equipe.id})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-pencil-square me-1"></i> Editar Equipe
                    </a>
                    <a th:href="@{/equipes}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Voltar
                    </a>
                </div>
            </div>

            <div class="row g-4">
                <!-- Informacoes da Equipe -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body">
                            <h5 class="card-title fw-bold border-bottom pb-2 mb-3">
                                <i class="bi bi-info-circle me-2 text-primary"></i> Informacoes
                            </h5>
                            
                            <!-- Lider -->
                            <div class="mb-3">
                                <small class="text-uppercase fw-bold text-muted d-block mb-1">Lider Responsavel</small>
                                <div th:if="${equipe.lider != null}" class="d-flex align-items-center">
                                    <div class="avatar-membro me-2" th:text="${equipe.lider.iniciais}">L</div>
                                    <div>
                                        <span class="fw-semibold d-block" th:text="${equipe.lider.nome}">Nome</span>
                                        <small class="text-muted" th:text="${equipe.lider.cargo}">Cargo</small>
                                    </div>
                                </div>
                                <span th:unless="${equipe.lider != null}" class="text-muted fst-italic">Nao definido</span>
                            </div>

                            <!-- Tamanho -->
                            <div class="mb-3">
                                <small class="text-uppercase fw-bold text-muted d-block mb-1">Tamanho do Time</small>
                                <span class="badge bg-light text-dark border">
                                    <i class="bi bi-person-fill me-1"></i> 
                                    <span th:text="${membros != null ? #lists.size(membros) : 0}">0</span> 
                                    <span th:text="${(membros != null ? #lists.size(membros) : 0) == 1 ? 'membro' : 'membros'}">membros</span>
                                </span>
                            </div>

                            <!-- Descricao -->
                            <div class="mb-3" th:if="${equipe.descricao != null and !equipe.descricao.isEmpty()}">
                                <small class="text-uppercase fw-bold text-muted d-block mb-1">Descricao</small>
                                <p class="mb-0 small text-secondary" th:text="${equipe.descricao}">Descricao</p>
                            </div>

                            <!-- Data -->
                            <div class="mb-0">
                                <small class="text-uppercase fw-bold text-muted d-block mb-1">Criada em</small>
                                <span class="small" th:text="${equipe.dataCriacao != null ? #temporals.format(equipe.dataCriacao, 'dd/MM/yyyy') : '-'}">data</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gestao de Membros -->
                <div class="col-lg-8">
                    <!-- Adicionar Novo Membro -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body">
                            <h5 class="card-title fw-bold mb-3">
                                <i class="bi bi-person-plus me-2 text-success"></i> Adicionar Membro
                            </h5>
                            <form th:action="@{/equipes/{id}/adicionar-membro(id=${equipe.id})}" method="post" class="row g-3">
                                <div class="col-md-5">
                                    <label for="usuarioId" class="form-label small">Colaborador</label>
                                    <select class="form-select form-select-sm" id="usuarioId" name="usuarioId" required>
                                        <option value="">Selecione...</option>
                                        <option th:each="user : ${usuariosDisponiveis}" 
                                                th:value="${user.id}" 
                                                th:text="${user.nome} + ' - ' + ${user.cargo}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label for="funcao" class="form-label small">Funcao na Equipe</label>
                                    <input type="text" class="form-control form-control-sm" id="funcao" name="funcao" 
                                           placeholder="Ex: Desenvolvedor, Designer..." required maxlength="50">
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary btn-sm w-100">
                                        <i class="bi bi-plus-lg me-1"></i> Add
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Lista de Membros -->
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title fw-bold mb-3">
                                <i class="bi bi-people me-2 text-info"></i> Membros Atuais
                            </h5>
                            
                            <div th:if="${membros == null or #lists.isEmpty(membros)}" class="text-center py-5 border rounded bg-light">
                                <i class="bi bi-people fs-1 text-muted mb-2 d-block"></i>
                                <p class="mb-0 text-secondary">Nenhum membro adicionado ainda.</p>
                            </div>

                            <div th:each="membro : ${membros}" class="membro-card d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="avatar-membro me-3" th:text="${membro.usuario != null ? membro.usuario.iniciais : '?'}">U</div>
                                    <div>
                                        <h6 class="mb-1 fw-bold" th:text="${membro.usuario != null ? membro.usuario.nome : 'Desconhecido'}">Nome</h6>
                                        <p class="mb-0 text-muted small">
                                            <i class="bi bi-briefcase me-1"></i> 
                                            <span th:text="${membro.usuario != null ? membro.usuario.cargo : '-'}">Cargo</span>
                                        </p>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center gap-3">
                                    <span class="funcao-badge shadow-sm" th:text="${membro.funcao}">Funcao</span>
                                    <a th:href="@{/equipes/{equipeId}/remover-membro/{membroId}(equipeId=${equipe.id}, membroId=${membro.id})}" 
                                       class="btn btn-sm btn-outline-danger border-0"
                                       title="Remover da equipe"
                                       th:onclick="'return confirm(\'' + #{app.delete.confirm} + '\')'">
                                        <i class="bi bi-trash3-fill"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="#{team.title}">Equipes - A3 2.0</title>
    <style>
        .equipe-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--border-color);
        }
        .equipe-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .avatar-lider {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white; display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <section layout:fragment="content">
        <div class="container mb-5">
            <!-- Cabecalho -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-people-fill text-primary me-2"></i>
                        <span th:text="#{team.title}">Gestao de Equipes</span>
                    </h2>
                    <p class="text-muted mb-0 small" th:text="'Total: ' + (${#lists.size(equipes)} ?: 0) + ' equipe(s)'">Total: 0</p>
                </div>
                <a th:href="@{/equipes/novo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i> <span th:text="#{team.new}">Nova Equipe</span>
                </a>
            </div>

            <!-- Busca -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/equipes}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label small text-muted">Buscar</label>
                            <input type="text" name="termo" class="form-control form-control-sm" 
                                   placeholder="Nome da equipe ou lider..." th:value="${param.termo}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-funnel me-1"></i> Filtrar
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/equipes}" class="btn btn-outline-secondary btn-sm w-100">
                                <i class="bi bi-x-circle me-1"></i> Limpar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Estado vazio -->
            <div th:if="${equipes == null or #lists.isEmpty(equipes)}" class="text-center py-5">
                <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                <h5 class="text-muted">Nenhuma equipe cadastrada ainda.</h5>
                <a th:href="@{/equipes/novo}" class="btn btn-outline-primary mt-2">
                    <i class="bi bi-plus-circle me-1"></i> Criar Primeira Equipe
                </a>
            </div>

            <!-- Cards de equipes -->
            <div th:unless="${equipes == null or #lists.isEmpty(equipes)}" class="row g-4">
                <div th:each="equipe : ${equipes}" class="col-md-6 col-lg-4">
                    <div class="card equipe-card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title fw-bold mb-0" th:text="${equipe.nome}">Nome</h5>
                                <span class="badge bg-light text-dark border" th:text="'#' + ${equipe.id}">#0</span>
                            </div>
                            <p class="card-text text-muted small mb-3" th:text="${equipe.descricao} ?: 'Sem descricao'">Descricao</p>
                            
                            <!-- Lider -->
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-person-badge text-primary me-2"></i>
                                <span class="small text-muted me-2">Lider:</span>
                                <div th:if="${equipe.lider != null}" class="d-flex align-items-center">
                                    <div class="avatar-lider me-2" th:text="${equipe.lider.iniciais}">L</div>
                                    <span class="fw-semibold small" th:text="${equipe.lider.nome}">Nome</span>
                                </div>
                                <span th:unless="${equipe.lider != null}" class="text-muted fst-italic small">Nao definido</span>
                            </div>

                            <!-- Membros -->
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-people text-info me-2"></i>
                                <span class="small text-muted me-2">Membros:</span>
                                <span class="badge bg-light text-dark border">
                                    <span th:text="${equipe.membros != null ? #lists.size(equipe.membros) : 0}">0</span>
                                    <span th:text="${(equipe.membros != null ? #lists.size(equipe.membros) : 0) == 1 ? ' membro' : ' membros'}">membros</span>
                                </span>
                            </div>

                            <!-- Data -->
                            <div class="small text-muted mb-3">
                                <i class="bi bi-calendar me-1"></i>
                                Criada em: <span th:text="${equipe.dataCriacao != null ? #temporals.format(equipe.dataCriacao, 'dd/MM/yyyy') : '-'}">data</span>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent border-top-0 pt-0">
                            <div class="d-flex gap-2">
                                <a th:href="@{/equipes/{id}(id=${equipe.id})}" class="btn btn-sm btn-outline-info flex-fill">
                                    <i class="bi bi-eye me-1"></i> Detalhes
                                </a>
                                <a th:href="@{/equipes/editar/{id}(id=${equipe.id})}" class="btn btn-sm btn-outline-warning flex-fill">
                                    <i class="bi bi-pencil me-1"></i> Editar
                                </a>
                                <form th:action="@{/equipes/excluir/{id}(id=${equipe.id})}" method="post" class="d-inline flex-fill"
                                      th:onclick="'return confirm(\'' + #{app.delete.confirm} + '\')'">
                                    <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                        <i class="bi bi-trash me-1"></i> Excluir
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

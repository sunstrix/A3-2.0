<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipes - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body style="background-color: var(--bg-secondary); color: var(--text-primary);">
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-people-fill" style="color: var(--primary);"></i> Gestão de Equipes</h2>
            <a href="/equipes/novo" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nova Equipe
            </a>
        </div>

        <!-- Mensagens de feedback -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert" style="background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid var(--danger);">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-md border-0">
            <div class="card-body p-4">
                <!-- Estado vazio -->
                <div th:if="${equipes == null or #lists.isEmpty(equipes)}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 4rem; color: var(--text-muted);"></i>
                    <h5 class="mt-3" style="color: var(--text-secondary);">Nenhuma equipe cadastrada ainda.</h5>
                    <a href="/equipes/novo" class="btn btn-outline-primary mt-2">
                        <i class="bi bi-plus-circle"></i> Criar Primeira Equipe
                    </a>
                </div>

                <!-- Tabela de equipes -->
                <div th:unless="${equipes == null or #lists.isEmpty(equipes)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color);">
                                <th style="color: var(--text-secondary);">ID</th>
                                <th style="color: var(--text-secondary);">Nome da Equipe</th>
                                <th style="color: var(--text-secondary);">Líder</th>
                                <th style="color: var(--text-secondary);">Membros</th>
                                <th class="text-end" style="color: var(--text-secondary);">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="equipe : ${equipes}" style="border-bottom: 1px solid var(--border-color);">
                                <td th:text="${equipe.id}" class="fw-bold" style="color: var(--primary);"></td>
                                <td>
                                    <strong th:text="${equipe.nome}" style="color: var(--text-primary);"></strong>
                                    <br>
                                    <small style="color: var(--text-secondary);" th:text="${equipe.descricao}"></small>
                                </td>
                                <td>
                                    <span th:if="${equipe.lider != null}" th:text="${equipe.lider.nome}" style="color: var(--text-primary);">-</span>
                                    <span th:if="${equipe.lider == null}" style="color: var(--text-muted);">-</span>
                                </td>
                                <td>
                                    <span th:if="${equipe.membros != null}" class="badge" style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
                                        <i class="bi bi-person me-1"></i>
                                        <span th:text="${#lists.size(equipe.membros)}">0</span> membro(s)
                                    </span>
                                    <span th:if="${equipe.membros == null}" style="color: var(--text-muted);">0 membro(s)</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/equipes/{id}(id=${equipe.id})}" 
                                           class="btn btn-outline-info" title="Ver Detalhes">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/equipes/editar/{id}(id=${equipe.id})}" 
                                           class="btn btn-outline-warning" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/equipes/excluir/{id}(id=${equipe.id})}" 
                                              method="post" style="display: inline;"
                                              onsubmit="return confirm('Tem certeza que deseja excluir esta equipe?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Excluir">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{common/footer :: footer}"></div>
    <div th:replace="~{common/theme-toggle :: toggle}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

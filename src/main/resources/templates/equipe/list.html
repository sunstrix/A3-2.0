<!-- SUBSTITUA a tabela vazia por: -->
<table th:if="${!equipes.isEmpty()}" class="table table-hover align-middle">
    <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Nome da Equipe</th>
            <th>Líder</th>
            <th>Membros</th>
            <th class="text-center">Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="equipe : ${equipes}">
            <td th:text="${equipe.id}"></td>
            <td class="fw-bold" th:text="${equipe.nome}"></td>
            <td th:text="${equipe.lider?.nome ?: 'Não definido'}"></td>
            <td>
                <span class="badge bg-info text-dark" th:text="${#lists.size(equipe.membros)} + ' membros'"></span>
            </td>
            <td class="text-center">
                <a th:href="@{/equipes/{id}(id=${equipe.id})}" class="btn btn-sm btn-success me-1" title="Ver Detalhes e Membros">
                    <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{/equipes/editar/{id}(id=${equipe.id})}" class="btn btn-sm btn-warning me-1" title="Editar">
                    <i class="bi bi-pencil"></i>
                </a>
                <a th:href="@{/equipes/deletar/{id}(id=${equipe.id})}" class="btn btn-sm btn-danger" title="Excluir"
                   onclick="return confirm('Tem certeza que deseja excluir esta equipe?');">
                    <i class="bi bi-trash"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>

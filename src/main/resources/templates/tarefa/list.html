<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <!-- Navbar Global -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4">
        
        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-list-check text-primary"></i> Gerenciamento de Tarefas
            </h2>
            <a href="/projetos" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Voltar ao Menu
            </a>
        </div>

        <!-- Mensagens de Feedback -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Card da Lista -->
        <div class="card shadow-sm border-0">
            <div class="card-body">

                <!-- Estado Vazio (Nenhuma tarefa) -->
                <div th:if="${tarefas == null or #lists.isEmpty(tarefas)}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
                    <h5 class="mt-3">Nenhuma tarefa cadastrada ainda.</h5>
                    <p class="text-muted">Crie um projeto e adicione tarefas para começar.</p>
                    <a href="/projetos" class="btn btn-primary mt-2">
                        <i class="bi bi-folder-plus"></i> Criar um Projeto
                    </a>
                </div>

                <!-- Tabela de Tarefas -->
                <div th:unless="${tarefas == null or #lists.isEmpty(tarefas)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Projeto</th>
                                <th>Responsável</th>
                                <th>Prioridade</th>
                                <th>Vencimento</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tarefa : ${tarefas}">
                                <td th:text="${tarefa.id}"></td>
                                <td>
                                    <strong th:text="${tarefa.titulo}">Título da Tarefa</strong>
                                    <br>
                                    <small class="text-muted" th:text="${#strings.abbreviate(tarefa.descricao, 50)}"></small>
                                </td>
                                <!-- ✅ CORREÇÃO: Usando projetoNome (String) em vez de projeto.nome (objeto) -->
                                <td>
                                    <span th:text="${tarefa.projetoNome != null ? tarefa.projetoNome : '-'}"></span>
                                </td>
                                <td>
                                    <span th:text="${tarefa.responsavelNome != null ? tarefa.responsavelNome : 'Não atribuído'}"></span>
                                </td>
                                <td>
                                    <!-- ✅ Expressão ternária em único ${} para evitar erro de parsing -->
                                    <span class="badge"
                                          th:classappend="${(tarefa.prioridade == 'ALTA' or tarefa.prioridade == 'CRITICA') ? 'bg-danger' : (tarefa.prioridade == 'MEDIA' ? 'bg-warning text-dark' : 'bg-success')}"
                                          th:text="${tarefa.prioridade}">
                                    </span>
                                </td>
                                <td>
                                    <span th:text="${tarefa.dataVencimento != null ? #temporals.format(tarefa.dataVencimento, 'dd/MM/yyyy') : '-'}"></span>
                                    <span th:if="${tarefa.atrasada}" class="badge bg-danger ms-1">Atrasada</span>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${tarefa.status}"></span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <!-- Editar -->
                                        <a th:href="@{/tarefas/editar/{id}(id=${tarefa.id})}" class="btn btn-outline-warning" title="Editar">
                                            <i class="bi bi-pencil-fill"></i>
                                        </a>
                                        <!-- Excluir -->
                                        <form th:action="@{/tarefas/deletar/{id}(id=${tarefa.id})}" method="post" style="display:inline;"
                                              onsubmit="return confirm('Tem certeza que deseja excluir esta tarefa?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Excluir">
                                                <i class="bi bi-trash-fill"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer Global -->
    <div th:replace="~{common/footer :: footer}"></div>
    
    <!-- Botão de Tema -->
    <div th:replace="~{common/theme-toggle :: toggle}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

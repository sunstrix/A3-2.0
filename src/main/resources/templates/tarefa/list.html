<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body { background-color: var(--bg-secondary); color: var(--text-primary); }
        .card { 
            background-color: var(--bg-primary); 
            border: 1px solid var(--border-color); 
            box-shadow: var(--shadow-md);
            border-radius: 12px;
        }
        .table { color: var(--text-primary); }
        .table-hover tbody tr:hover {
            background-color: rgba(99, 102, 241, 0.08) !important;
        }
        thead th {
            background-color: var(--bg-tertiary) !important;
            color: var(--text-secondary) !important;
            border-bottom: 2px solid var(--border-color) !important;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .badge-projeto {
            background-color: var(--bg-tertiary);
            color: var(--primary);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Navbar Global -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4 fade-in">
        
        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">
                <i class="bi bi-list-check" style="color: var(--primary);"></i> Gerenciamento de Tarefas
            </h2>
            <div class="d-flex gap-2">
                <a href="/projetos" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Voltar aos Projetos
                </a>
            </div>
        </div>

        <!-- Mensagens de Feedback -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert" style="background-color: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid var(--success);">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert" style="background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid var(--danger);">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Card da Lista -->
        <div class="card mb-5">
            <div class="card-body p-0">

                <!-- Estado Vazio -->
                <div th:if="${tarefas == null or #lists.isEmpty(tarefas)}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 4rem; color: var(--text-muted);"></i>
                    <h5 class="mt-3" style="color: var(--text-secondary);">Nenhuma tarefa encontrada.</h5>
                    <p class="text-muted small">As tarefas aparecem aqui após serem criadas dentro de um projeto no Kanban.</p>
                    <a href="/projetos" class="btn btn-primary mt-2 px-4">
                        <i class="bi bi-folder2-open me-1"></i> Ver Projetos
                    </a>
                </div>

                <!-- Tabela de Tarefas -->
                <div th:unless="${tarefas == null or #lists.isEmpty(tarefas)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4">Título / Descrição</th>
                                <th>Projeto</th>
                                <th>Responsável</th>
                                <th>Prioridade</th>
                                <th>Vencimento</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tarefa : ${tarefas}" style="border-bottom: 1px solid var(--border-color);">
                                <td class="ps-4">
                                    <strong style="color: var(--text-primary);" th:text="${tarefa.titulo}">Título</strong>
                                    <br>
                                    <small style="color: var(--text-muted);" th:text="${tarefa.descricao != null and #strings.length(tarefa.descricao) > 45 ? #strings.substring(tarefa.descricao, 0, 45) + '...' : tarefa.descricao}"></small>
                                </td>
                                <td>
                                    <span class="badge badge-projeto" th:text="${tarefa.getProjetoNomeOuTraco()}">Projeto</span>
                                </td>
                                <td style="color: var(--text-secondary);">
                                    <i class="bi bi-person me-1 opacity-50"></i>
                                    <span th:text="${tarefa.getResponsavelNomeOuTraco()}">Responsável</span>
                                </td>
                                <td>
                                    <span th:class="'badge ' + ${tarefa.getPrioridadeCssClass()}" 
                                          th:text="${tarefa.getPrioridadeDescricao()}">Prioridade</span>
                                </td>
                                <td>
                                    <div th:if="${tarefa.dataVencimento != null}" style="color: var(--text-primary);">
                                        <span th:text="${#temporals.format(tarefa.dataVencimento, 'dd/MM/yyyy')}">01/01/2026</span>
                                        <i th:if="${tarefa.atrasada}" class="bi bi-exclamation-circle-fill text-danger ms-1" title="Atrasada"></i>
                                    </div>
                                    <span th:unless="${tarefa.dataVencimento != null}" style="color: var(--text-muted);">-</span>
                                </td>
                                <td>
                                    <span th:class="'badge ' + ${tarefa.getStatusCssClass()}" 
                                          th:text="${tarefa.getStatusDescricao()}">Status</span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group">
                                        <a th:href="@{/tarefas/editar/{id}(id=${tarefa.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/tarefas/deletar/{id}(id=${tarefa.id})}" 
                                           class="btn btn-sm btn-outline-danger" 
                                           title="Excluir"
                                           onclick="return confirm('Tem certeza que deseja remover esta tarefa?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- Fragmentos Globais -->
    <div th:replace="~{common/footer :: footer}"></div>
    <div th:replace="~{common/theme-toggle :: toggle}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

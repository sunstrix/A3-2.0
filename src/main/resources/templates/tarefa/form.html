<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tarefa.id != null} ? 'Editar Tarefa' : 'Nova Tarefa'">Formulário de Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- ✅ CORREÇÃO: Alterado de fragments/ para common/ para coincidir com a estrutura do projeto -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-clipboard-check"></i>
                            <span th:text="${tarefa.id != null} ? 'Editar Tarefa' : 'Nova Tarefa'">Formulário</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- ✅ CORREÇÃO: Ajustadas as rotas th:action para bater com o TarefaController -->
                        <form th:action="${tarefa.id != null} ? @{/tarefas/atualizar/{id}(id=${tarefa.id})} : @{/tarefas}"
                              th:object="${tarefa}"
                              method="post">
                              
                            <!-- ✅ CORREÇÃO CRÍTICA: O bloco de erros deve estar DENTRO do form para ter acesso ao th:object -->
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <strong><i class="bi bi-exclamation-triangle"></i> Erros de validação:</strong>
                                <ul class="mb-0 mt-2">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erro</li>
                                </ul>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            
                            <!-- ID oculto para edição -->
                            <input type="hidden" th:field="*{id}" th:if="${tarefa.id != null}">
                            
                            <!-- Campo oculto para o Projeto (Obrigatório para o Service) -->
                            <input type="hidden" th:name="projeto.id" th:value="${projetoId != null ? projetoId : (tarefa.projeto != null ? tarefa.projeto.id : '')}">
                            
                            <!-- Título -->
                            <div class="mb-3">
                                <label for="titulo" class="form-label">
                                    Título <span class="text-danger">*</span>
                                </label>
                                <input type="text" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                                       id="titulo" 
                                       th:field="*{titulo}" 
                                       placeholder="Digite o título da tarefa"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">
                                    Erro no título
                                </div>
                            </div>

                            <!-- Descrição -->
                            <div class="mb-3">
                                <label for="descricao" class="form-label">Descrição</label>
                                <textarea class="form-control" 
                                          th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                          id="descricao" 
                                          th:field="*{descricao}" 
                                          rows="4"
                                          placeholder="Descreva os detalhes da tarefa"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                                    Erro na descrição
                                </div>
                            </div>

                            <div class="row">
                                <!-- Prioridade -->
                                <div class="col-md-6 mb-3">
                                    <label for="prioridade" class="form-label">
                                        Prioridade <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" 
                                            th:classappend="${#fields.hasErrors('prioridade')} ? 'is-invalid'"
                                            id="prioridade" 
                                            th:field="*{prioridade}"
                                            required>
                                        <option value="">Selecione...</option>
                                        <option th:each="p : ${T(br.com.projetoA3.enums.Prioridade).values()}" 
                                                th:value="${p}" th:text="${p}">Prioridade</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}">
                                        Erro na prioridade
                                    </div>
                                </div>

                                <!-- Status -->
                                <div class="col-md-6 mb-3">
                                    <label for="status" class="form-label">
                                        Status <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" 
                                            th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
                                            id="status" 
                                            th:field="*{status}"
                                            required>
                                        <option value="">Selecione...</option>
                                        <option th:each="s : ${T(br.com.projetoA3.enums.StatusTarefa).values()}" 
                                                th:value="${s}" th:text="${s}">Status</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                                        Erro no status
                                    </div>
                                </div>
                            </div>

                            <!-- Data de Vencimento -->
                            <div class="mb-3">
                                <label for="dataVencimento" class="form-label">Data de Vencimento</label>
                                <input type="date" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('dataVencimento')} ? 'is-invalid'"
                                       id="dataVencimento" 
                                       th:field="*{dataVencimento}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dataVencimento')}" th:errors="*{dataVencimento}">
                                    Erro na data
                                </div>
                            </div>

                            <!-- Responsável -->
                            <div class="mb-3">
                                <label for="responsavel" class="form-label">Responsável</label>
                                <select class="form-select" 
                                        th:classappend="${#fields.hasErrors('responsavel')} ? 'is-invalid'"
                                        id="responsavel" 
                                        th:field="*{responsavel}">
                                    <option value="">Nenhum responsável</option>
                                    <option th:each="usuario : ${usuarios}" 
                                            th:value="${usuario.id}" 
                                            th:text="${usuario.nome}">
                                        Usuário
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('responsavel')}" th:errors="*{responsavel}">
                                    Erro no responsável
                                </div>
                            </div>

                            <!-- Botões de ação -->
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/tarefas/kanban/{id}(id=${projetoId != null ? projetoId : (tarefa.projeto != null ? tarefa.projeto.id : 0)})}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Voltar ao Kanban
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 
                                    <span th:text="${tarefa.id != null} ? 'Atualizar' : 'Salvar'">Salvar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ CORREÇÃO: Alterado de fragments/ para common/ -->
    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

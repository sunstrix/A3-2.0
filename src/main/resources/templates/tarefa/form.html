<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tarefa.id != null} ? 'Editar Tarefa' : 'Nova Tarefa'">Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <!-- Fragmento CSRF para proteção contra ataques CSRF -->
    <div th:replace="~{common/csrf-meta :: csrf}"></div>
</head>
<body>

    <!-- Navbar Global -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4" style="max-width: 800px;">
        
        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">
                <i class="bi bi-kanban-fill text-primary"></i>
                <span th:text="${tarefa.id != null} ? 'Editar Tarefa' : 'Nova Tarefa'">Nova Tarefa</span>
            </h2>
            <a th:href="@{/tarefas/kanban/{id}(id=${projetoId})}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <!-- Mensagem de erro geral (vinda do controller via Model) -->
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>Erro ao salvar:</strong> <span th:text="${erro}">Erro desconhecido</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 
            ⚠️ CRÍTICO: O <form> DEVE ter th:object="${tarefa}" para que 
            as expressões #fields e *{campo} funcionem corretamente.
            Também é necessária a ação dinâmica para criação vs edição.
        -->
        <form th:action="${tarefa.id != null} ? @{/tarefas/atualizar/{id}(id=${tarefa.id})} : @{/tarefas}"
              th:object="${tarefa}"
              method="post"
              class="card shadow-sm border-0"
              style="border-radius: 12px;">
            
            <div class="card-body p-4">

                <!-- ✅ ERROS GLOBAIS DE VALIDAÇÃO (agora DENTRO do form com th:object) -->
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <strong>Por favor, corrija os erros abaixo:</strong>
                    <ul class="mb-0 mt-2">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erro</li>
                    </ul>
                </div>

                <!-- Campo oculto com ID do projeto (obrigatório para criar nova tarefa) -->
                <input type="hidden" name="projeto.id" th:value="${projetoId}" />
                
                <!-- Campo oculto com ID da tarefa (para atualização) -->
                <input type="hidden" th:field="*{id}" />

                <!-- Título -->
                <div class="mb-3">
                    <label for="titulo" class="form-label fw-semibold">
                        Título <span class="text-danger">*</span>
                    </label>
                    <input type="text" 
                           class="form-control" 
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid' : ''"
                           id="titulo" 
                           th:field="*{titulo}"
                           placeholder="Ex: Implementar tela de login"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                </div>

                <!-- Descrição -->
                <div class="mb-3">
                    <label for="descricao" class="form-label fw-semibold">Descrição</label>
                    <textarea class="form-control" 
                              id="descricao" 
                              th:field="*{descricao}"
                              rows="3"
                              placeholder="Descreva os detalhes da tarefa..."></textarea>
                </div>

                <div class="row">
                    <!-- Status -->
                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option th:each="s : ${statusOptions}" 
                                    th:value="${s}" 
                                    th:text="${s.name()}">Status</option>
                        </select>
                    </div>

                    <!-- Prioridade -->
                    <div class="col-md-6 mb-3">
                        <label for="prioridade" class="form-label fw-semibold">Prioridade</label>
                        <select class="form-select" id="prioridade" th:field="*{prioridade}">
                            <option th:each="p : ${T(br.com.projetoA3.enums.Prioridade).values()}" 
                                    th:value="${p}" 
                                    th:text="${p.name()}">Prioridade</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <!-- Data de Vencimento -->
                    <div class="col-md-6 mb-3">
                        <label for="dataVencimento" class="form-label fw-semibold">Data de Vencimento</label>
                        <input type="date" 
                               class="form-control" 
                               id="dataVencimento" 
                               th:field="*{dataVencimento}">
                    </div>

                    <!-- Responsável -->
                    <div class="col-md-6 mb-3">
                        <label for="responsavel" class="form-label fw-semibold">Responsável</label>
                        <select class="form-select" id="responsavel" name="responsavel.id">
                            <option value="">-- Sem responsável --</option>
                            <option th:each="u : ${usuarios}" 
                                    th:value="${u.id}" 
                                    th:text="${u.nome}"
                                    th:selected="${tarefa.responsavel != null and tarefa.responsavel.id == u.id}">
                                Usuário
                            </option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- Rodapé com botões -->
            <div class="card-footer bg-white border-0 p-4 pt-0">
                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/tarefas/kanban/{id}(id=${projetoId})}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="${tarefa.id != null} ? 'Atualizar Tarefa' : 'Salvar Tarefa'">Salvar</span>
                    </button>
                </div>
            </div>

        </form>

    </div>

    <!-- Footer Global -->
    <div th:replace="~{common/footer :: footer}"></div>
    
    <!-- Botão de Tema -->
    <div th:replace="~{common/theme-toggle :: toggle}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

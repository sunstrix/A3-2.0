<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tarefa.id != null} ? 'Editar Tarefa' : 'Nova Tarefa'">Formulário de Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <!-- ✅ CORREÇÃO: Caminho do fragmento para 'common' -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white p-3">
                        <h4 class="mb-0">
                            <i class="bi bi-clipboard-plus me-2"></i>
                            <span th:text="${tarefa.id != null} ? 'Editar Tarefa' : 'Nova Tarefa'">Formulário</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- ✅ CORREÇÃO: O formulário inicia aqui para prover o th:object aos campos de erro -->
                        <form th:action="${tarefa.id != null} ? @{/tarefas/atualizar/{id}(id=${tarefa.id})} : @{/tarefas}"
                              th:object="${tarefa}"
                              method="post">

                            <!-- ✅ CORREÇÃO: Bloco de erros movido para dentro da tag <form> -->
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <strong><i class="bi bi-exclamation-triangle"></i> Erros de validação:</strong>
                                <ul class="mb-0 mt-2">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erro</li>
                                </ul>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <!-- Campos ocultos -->
                            <input type="hidden" th:field="*{id}" th:if="${tarefa.id != null}">
                            <!-- Vincula o projeto ID vindo do parâmetro ou da tarefa existente -->
                            <input type="hidden" name="projeto.id" th:value="${projetoId != null ? projetoId : (tarefa.projeto != null ? tarefa.projeto.id : '')}">
                            
                            <!-- Título -->
                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-bold">Título <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{titulo}" 
                                       th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                                       placeholder="Ex: Implementar Login" required>
                                <div class="invalid-feedback" th:errors="*{titulo}"></div>
                            </div>

                            <!-- Descrição -->
                            <div class="mb-3">
                                <label for="descricao" class="form-label fw-bold">Descrição</label>
                                <textarea class="form-control" th:field="*{descricao}" rows="3"
                                          th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                          placeholder="Detalhes da tarefa..."></textarea>
                            </div>

                            <div class="row">
                                <!-- Prioridade -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Prioridade <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{prioridade}" required>
                                        <option th:each="p : ${T(br.com.projetoA3.enums.Prioridade).values()}" 
                                                th:value="${p}" th:text="${p}">MEDIA</option>
                                    </select>
                                </div>

                                <!-- Status -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{status}" required>
                                        <option th:each="s : ${T(br.com.projetoA3.enums.StatusTarefa).values()}" 
                                                th:value="${s}" th:text="${s}">A_FAZER</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Data de Vencimento -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Data de Vencimento</label>
                                    <input type="date" class="form-control" th:field="*{dataVencimento}">
                                </div>

                                <!-- Responsável -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Responsável</label>
                                    <select class="form-select" th:field="*{responsavel}">
                                        <option value="">Não atribuído</option>
                                        <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nome}">Usuário</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">

                            <!-- Botões -->
                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/tarefas/kanban/{id}(id=${projetoId != null ? projetoId : (tarefa.projeto != null ? tarefa.projeto.id : 0)})}" 
                                   class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary btn-lg px-4">
                                    <i class="bi bi-save me-2"></i> 
                                    <span th:text="${tarefa.id != null} ? 'Atualizar' : 'Criar Tarefa'">Salvar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ CORREÇÃO: Fragmento do footer e tema -->
    <div th:replace="~{common/footer :: footer}"></div>
    <div th:replace="~{common/theme-toggle :: toggle}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

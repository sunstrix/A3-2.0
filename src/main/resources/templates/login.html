<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif;
        }
        .login-card { 
            max-width: 400px; width: 100%; padding: 2.5rem; 
            border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
            background: white;
        }
        .btn-login { 
            width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 500; 
            background-color: #4f46e5; border: none; transition: 0.3s;
        }
        .btn-login:hover { background-color: #4338ca; }
        .alert-error { margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4 text-primary">🔐 Acesso ao Sistema</h3>
        
        <div th:if="${param.error}" class="alert alert-danger alert-error text-center" role="alert">
            ⚠️ Login ou senha inválidos. Tente novamente.
        </div>

        <!-- Os nomes "username" e "password" são os padrões esperados pelo Spring Security -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Login</label>
                <input type="text" class="form-control" id="username" name="username" 
                       required placeholder="Ex: admin">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" 
                       required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn btn-primary btn-login">Entrar</button>
        </form>

        <p class="text-center mt-4 text-muted small">Projeto A3 2.0 - Gestão de Projetos & Equipes</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - A3 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            background-color: var(--bg-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
        }
        .login-container {
            max-width: 420px;
            width: 100%;
            padding: 1rem;
        }
        .login-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header i {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        .login-header h2 {
            font-weight: 700;
            color: var(--text-primary);
        }
        .form-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .form-control {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.2s;
            color: white;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            color: white;
        }
        .input-group-text {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-muted);
        }
        .input-group .form-control {
            border-left: none;
        }
        .credentials-hint {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .credentials-hint strong {
            color: var(--primary);
        }
        code {
            color: var(--warning);
            background: rgba(0,0,0,0.2);
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-header">
                <i class="bi bi-kanban-fill"></i>
                <h2>A3 2.0</h2>
                <p class="mb-0" style="color: var(--text-secondary);">Sistema de Gestão de Projetos</p>
            </div>

            <!-- Mensagem de Erro -->
            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>
                    <strong class="small">Login ou senha inválidos.</strong>
                </div>
            </div>

            <!-- Mensagem de Logout -->
            <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>
                <div class="small">Você saiu do sistema com sucesso.</div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="login" class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" 
                               class="form-control" 
                               id="login" 
                               name="login" 
                               placeholder="Digite seu usuário"
                               autocomplete="username"
                               required 
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" 
                               class="form-control" 
                               id="senha" 
                               name="senha" 
                               placeholder="Digite sua senha"
                               autocomplete="current-password"
                               required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar no Sistema
                </button>
            </form>

            <div class="credentials-hint">
                <strong>🔑 Usuários de teste:</strong>
                <div class="mt-2" style="color: var(--text-secondary);">
                    <div><code>admin</code> / <code>admin123</code></div>
                    <div><code>gerente</code> / <code>gerente123</code></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

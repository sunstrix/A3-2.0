<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${tituloPagina} ?: 'Tickets'">Lista de Tickets</title>
</head>
<body>
    <section layout:fragment="content">
        <div class="container mb-5">
            <!-- Cabecalho -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1" th:text="${tituloPagina} ?: 'Tickets'">Tickets</h2>
                    <p class="text-muted mb-0 small" th:text="'Total: ' + (${#lists.size(tickets)} ?: 0) + ' registro(s)'">Total: 0</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/tickets/abrir}" class="btn btn-primary" sec:authorize="!hasAnyRole('ADMINISTRADOR', 'GERENTE', 'ATENDENTE')">
                        <i class="bi bi-plus-circle me-1"></i> Novo Chamado
                    </a>
                    <a th:href="@{/painel/atendente}" class="btn btn-outline-primary" sec:authorize="hasAnyRole('ADMINISTRADOR', 'GERENTE', 'ATENDENTE')">
                        <i class="bi bi-headset me-1"></i> Painel
                    </a>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/tickets}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Status</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="ABERTO" th:selected="${param.status == 'ABERTO'}">Aberto</option>
                                <option value="EM_ANDAMENTO" th:selected="${param.status == 'EM_ANDAMENTO'}">Em Andamento</option>
                                <option value="AGUARDANDO_USUARIO" th:selected="${param.status == 'AGUARDANDO_USUARIO'}">Aguardando Usuario</option>
                                <option value="RESOLVIDO" th:selected="${param.status == 'RESOLVIDO'}">Resolvido</option>
                                <option value="FECHADO" th:selected="${param.status == 'FECHADO'}">Encerrado</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Prioridade</label>
                            <select name="prioridade" class="form-select form-select-sm">
                                <option value="">Todas</option>
                                <option value="BAIXA" th:selected="${param.prioridade == 'BAIXA'}">Baixa</option>
                                <option value="MEDIA" th:selected="${param.prioridade == 'MEDIA'}">Media</option>
                                <option value="ALTA" th:selected="${param.prioridade == 'ALTA'}">Alta</option>
                                <option value="CRITICA" th:selected="${param.prioridade == 'CRITICA'}">Critica</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small text-muted">Buscar</label>
                            <input type="text" name="termo" class="form-control form-control-sm" 
                                   placeholder="ID, titulo ou solicitante..." th:value="${param.termo}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-funnel me-1"></i> Filtrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabela de Tickets -->
            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr class="text-muted small text-uppercase">
                                <th>ID</th>
                                <th>Titulo</th>
                                <th>Solicitante</th>
                                <th>Atendente</th>
                                <th>Status</th>
                                <th>Prioridade</th>
                                <th>SLA</th>
                                <th>Tempo</th>
                                <th class="text-end">Acoes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${tickets}" th:class="${ticket.slaAtrasado} ? 'table-danger' : ''">
                                <td class="fw-bold" th:text="'#' + ${ticket.id}">#0</td>
                                <td>
                                    <a th:href="@{/tickets/detalhar/{id}(id=${ticket.id})}" 
                                       class="text-decoration-none fw-semibold"
                                       th:text="${ticket.titulo}">Titulo</a>
                                    <div class="small text-muted" th:if="${ticket.categoria != null}" th:text="${ticket.categoria}">Categoria</div>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-circle bg-secondary text-white d-flex align-items-center justify-content-center me-2" 
                                             style="width: 24px; height: 24px; border-radius: 50%; font-size: 0.6rem; font-weight: 600;">
                                            <span th:text="${ticket.solicitante.iniciais}">U</span>
                                        </div>
                                        <span th:text="${ticket.solicitante.nome}">Nome</span>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${ticket.atendente != null}">
                                        <div class="d-flex align-items-center">
                                            <div class="avatar-circle bg-success text-white d-flex align-items-center justify-content-center me-2" 
                                                 style="width: 24px; height: 24px; border-radius: 50%; font-size: 0.6rem; font-weight: 600;">
                                                <span th:text="${ticket.atendente.iniciais}">A</span>
                                            </div>
                                            <span th:text="${ticket.atendente.nome}">Nome</span>
                                        </div>
                                    </span>
                                    <span th:unless="${ticket.atendente != null}" class="text-muted fst-italic small">-</span>
                                </td>
                                <td>
                                    <span th:switch="${ticket.status}" class="badge">
                                        <span th:case="'ABERTO'" class="badge bg-primary">Aberto</span>
                                        <span th:case="'EM_ANDAMENTO'" class="badge bg-warning text-dark">Em Andamento</span>
                                        <span th:case="'AGUARDANDO_USUARIO'" class="badge bg-info text-dark">Aguardando</span>
                                        <span th:case="'RESOLVIDO'" class="badge bg-success">Resolvido</span>
                                        <span th:case="'FECHADO'" class="badge bg-secondary">Encerrado</span>
                                        <span th:case="'REABERTO'" class="badge bg-dark">Reaberto</span>
                                        <span th:case="*" class="badge bg-dark" th:text="${ticket.status}">Status</span>
                                    </span>
                                </td>
                                <td>
                                    <span th:switch="${ticket.prioridade}" class="badge">
                                        <span th:case="'BAIXA'" class="badge bg-info text-dark">Baixa</span>
                                        <span th:case="'MEDIA'" class="badge bg-warning text-dark">Media</span>
                                        <span th:case="'ALTA'" class="badge bg-orange text-white" style="background-color: #fd7e14;">Alta</span>
                                        <span th:case="'CRITICA'" class="badge bg-danger">Critica</span>
                                        <span th:case="*" class="badge bg-dark" th:text="${ticket.prioridade}">Prioridade</span>
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${ticket.slaAtrasado}" class="badge bg-danger" title="SLA Atrasado">
                                        <i class="bi bi-exclamation-triangle me-1"></i> Atrasado
                                    </span>
                                    <span th:if="${ticket.slaCumprido}" class="badge bg-success" title="SLA Cumprido">
                                        <i class="bi bi-check-circle me-1"></i> OK
                                    </span>
                                    <span th:if="${!ticket.slaAtrasado and ticket.slaVencimento != null and !ticket.slaCumprido}" 
                                          class="badge bg-light text-dark border" 
                                          th:text="${#temporals.format(ticket.slaVencimento, 'dd/MM HH:mm')}"
                                          title="Prazo SLA">data</span>
                                    <span th:if="${ticket.slaVencimento == null}" class="text-muted small">-</span>
                                </td>
                                <td class="small text-muted" th:text="${ticket.tempoDecorrido}">0h</td>
                                <td class="text-end">
                                    <div class="d-flex gap-1 justify-content-end">
                                        <a th:href="@{/tickets/detalhar/{id}(id=${ticket.id})}" 
                                           class="btn btn-sm btn-outline-primary" title="Visualizar">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <form th:if="${isAtendenteOuAdmin and ticket.status == 'ABERTO'}" 
                                              th:action="@{/tickets/{id}/atribuir-me(id=${ticket.id})}" 
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-success" title="Atribuir a mim">
                                                <i class="bi bi-person-check"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tickets)}">
                                <td colspan="9" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    Nenhum chamado encontrado.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

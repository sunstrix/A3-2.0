<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Fragmento da Navbar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/menu">
                <i class="bi bi-kanban-fill"></i> A3 2.0
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/equipes">Equipes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/projetos">Projetos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tarefas">Tarefas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/configuracoes">Configurações</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Botão de Alternância de Tema (Global) -->
    <!-- Este botão é posicionado via CSS (fixed bottom-right) -->
    <button id="themeToggle" class="theme-toggle" title="Alternar Tema">
        <i class="bi bi-moon-fill"></i>
    </button>

</body>
</html>

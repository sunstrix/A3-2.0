<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Fragmento da Navbar Global - Refatorado para Dark Mode e Relatórios -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark shadow-sm mb-3" 
         style="background-color: var(--bg-primary); border-bottom: 1px solid var(--border-color);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/menu" style="color: var(--primary);">
                <i class="bi bi-kanban-fill me-1"></i> A3 2.0
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'equipes' ? 'active' : ''}" href="/equipes">Equipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'projetos' ? 'active' : ''}" href="/projetos">Projetos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'tarefas' ? 'active' : ''}" href="/tarefas">Tarefas</a>
                    </li>
                    
                    <!-- ✅ Link para Usuários (apenas ADMINISTRADOR) -->
                    <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="nav-link" th:classappend="${activePage == 'usuarios' ? 'active' : ''}" href="/usuarios">Usuários</a>
                    </li>

                    <!-- ✅ NOVO: Link para Relatórios (ADMINISTRADOR e GERENTE) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR', 'GERENTE')">
                        <a class="nav-link" th:classappend="${activePage == 'relatorios' ? 'active' : ''}" href="/relatorios">Relatórios</a>
                    </li>
                    
                    <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="nav-link" th:classappend="${activePage == 'configuracoes' ? 'active' : ''}" href="/configuracoes">Configurações</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <!-- Identificação do Usuário Logado -->
                    <div class="d-none d-md-block text-end">
                        <small class="text-muted d-block" style="font-size: 0.7rem; line-height: 1;">Logado como</small>
                        <span class="fw-semibold small text-light" sec:authentication="name">Usuário</span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm d-flex align-items-center">
                            <i class="bi bi-box-arrow-right me-1"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>

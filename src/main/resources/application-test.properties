# ==========================================
# A3 2.0 - Perfil de Testes
# ==========================================
# Este perfil e usado em testes automatizados (JUnit).
# Banco isolado, dados limpos e e-mails simulados.

# ==========================================
# SERVIDOR
# ==========================================

# Porta dinamica (0 = porta aleatoria para testes paralelos)
server.port=0

# ==========================================
# BANCO DE DADOS - SQLite (Testes Isolados)
# ==========================================

# SQLite em arquivo separado para testes (evita conflito com dev/prod)
# Ou use :memory: para testes totalmente volateis
spring.datasource.url=jdbc:sqlite:./a3-20-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Pool minimo para testes
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ==========================================
# JPA / HIBERNATE - Testes
# ==========================================

# create-drop = recria o schema no inicio e dropa no fim (ideal para testes)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true

# Timezone do Hibernate para Brasil
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ==========================================
# INICIALIZACAO DE DADOS
# ==========================================

# Desativa execucao automatica de scripts SQL externos
spring.sql.init.mode=never

# ==========================================
# H2 CONSOLE (Desativado - usando SQLite)
# ==========================================
spring.h2.console.enabled=false

# ==========================================
# THYMELEAF - Testes
# ==========================================

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================================
# LOGGING - Testes
# ==========================================

# INFO para verificar fluxo dos testes
logging.level.br.com.projetoA3=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Reduzido para frameworks
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN

# Padrao enxuto
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n

# ==========================================
# E-MAIL - Testes (Simulado)
# ==========================================

# Em testes, o e-mail nao deve ser enviado para servidores reais.
# O EmailService deve detectar este perfil e usar apenas logs.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=true

# ==========================================
# UPLOAD DE ARQUIVOS - Testes
# ==========================================

# Pasta temporaria para anexos em testes
a3.upload.dir=./uploads/test/tickets/
a3.upload.allowed-extensions=jpg,jpeg,png,pdf,doc,docx,xls,xlsx,txt,zip

# ==========================================
# SEGURANCA - Testes
# ==========================================

# Usuario padrao para testes de integracao
spring.security.user.name=teste
spring.security.user.password=teste123
spring.security.user.roles=ADMIN,GERENTE,COLABORADOR

# Sessao curta para testes
server.servlet.session.timeout=5m

# ==========================================
# TIMEZONE E LOCALE
# ==========================================

# Forca Portugues do Brasil
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Timezone padrao
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ==========================================
# DEVTOOLS (Desativado em Testes)
# ==========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ==========================================
# INTERNACIONALIZACAO
# ==========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# =====================================================
# CONFIGURAÇÃO DO SERVIDOR
# =====================================================
server.port=8080

# =====================================================
# CONEXÃO COM SQLITE (BANCO LOCAL)
# =====================================================
spring.datasource.url=jdbc:sqlite:a3_2_0.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# =====================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# =====================================================
# update = cria/atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
# Mostra as queries SQL no console
spring.jpa.show-sql=true
# Dialeto específico para SQLite no Hibernate 6
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Formata o SQL no console para facilitar leitura
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# INICIALIZAÇÃO DE DADOS
# =====================================================
# Desativa execução automática de scripts SQL externos
spring.sql.init.mode=never

# =====================================================
# H2 CONSOLE (Desativado - usando SQLite)
# =====================================================
spring.h2.console.enabled=false

# =====================================================
# THYMELEAF (Templates HTML)
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
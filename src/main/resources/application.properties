# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# =====================================================
# DATABASE - SQLite com configurações de concorrência
# =====================================================
# Usa variável de ambiente se disponível (para Docker), senão usa path relativo
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/a3_projeto.db?journal_mode=WAL&synchronous=NORMAL&foreign_keys=ON}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ✅ CRÍTICO: Pool de conexões limitado a 1 para SQLite (não é thread-safe)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON;

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ✅ CRÍTICO: Desabilita Open Session in View para evitar vazamento de recursos
spring.jpa.open-in-view=false

# =====================================================
# THYMELEAF
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# =====================================================
# LOGGING - Mínimo para produção
# =====================================================
logging.level.root=WARN
logging.level.br.com.projetoA3=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# =====================================================
# SECURITY
# =====================================================
# Senhas devem ser hasheadas com BCrypt - nunca em texto plano
# Configurar via DataInitializer ou banco de dados
spring.security.user.password= # DEIXAR EM BRANCO - usar serviço de usuário real

# =====================================================
# MAIL (para relatórios)
# =====================================================
# Configurações dinâmicas via banco (ConfiguracaoService)
# Estas são apenas fallbacks para desenvolvimento
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
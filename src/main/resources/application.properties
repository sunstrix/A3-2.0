# ==========================================
# A3 2.0 - Configuracao Principal da Aplicacao
# ==========================================

# Nome da aplicacao
spring.application.name=A3-2.0

# Perfil ativo. Defina aqui: dev, prod ou test.
# Os arquivos application-{perfil}.properties serao carregados automaticamente.
spring.profiles.active=dev

# ==========================================
# BANCO DE DADOS - SQLite
# ==========================================

# URL de conexao com o banco SQLite local
spring.datasource.url=jdbc:sqlite:./a3-20.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Pool de conexoes (HikariCP - padrao do Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Timezone do banco para Brasil
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ==========================================
# THYMELEAF
# ==========================================

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================================
# SEGURANCA - Spring Security
# ==========================================

# Usuario padrao de desenvolvimento (apenas para testes locais)
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ==========================================
# UPLOAD DE ARQUIVOS
# ==========================================

# Limites de tamanho para anexos de tickets e uploads gerais
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# ==========================================
# RECURSOS ESTATICOS
# ==========================================

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework=INFO
logging.level.br.com.projetoA3=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Arquivo de log (opcional em producao)
# logging.file.name=logs/a3-20.log

# ==========================================
# SERVIDOR
# ==========================================

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# ==========================================
# INTERNACIONALIZACAO (i18n) - PT-BR
# ==========================================

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Forca o locale para Portugues do Brasil em todo o sistema
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# ==========================================
# TIMEZONE E JSON
# ==========================================

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==========================================
# SESSAO
# ==========================================

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ==========================================
# E-MAIL (SMTP) - HELP DESK
# ==========================================

# Servidor SMTP (exemplo: Gmail)
# Altere os valores abaixo para o servidor de e-mail da sua empresa.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app

# Autenticacao e criptografia TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts de conexao (milisegundos)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Encoding dos e-mails
spring.mail.default-encoding=UTF-8

# Debug de e-mail (true para ver logs detalhados no console)
spring.mail.properties.mail.debug=false

# Nome do remetente padrao
spring.mail.properties.mail.smtp.from=A3-2.0 Sistema de Help Desk

# ==========================================
# E-MAIL ASSINCRONO - THREAD POOL
# ==========================================

# Pool de threads para envio assincrono de notificacoes
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=email-async-

# ==========================================
# PASTA DE ANEXOS DOS TICKETS
# ==========================================

# Diretorio onde os anexos dos chamados serao armazenados
# Em producao, altere para um caminho absoluto fora do projeto
a3.upload.dir=./uploads/tickets/
a3.upload.allowed-extensions=jpg,jpeg,png,pdf,doc,docx,xls,xlsx,txt,zip
# Spring Boot Application Configuration
spring.application.name=A3-2.0

# Define o perfil ativo globalmente. 
# É aqui que a ativação deve ocorrer, e não dentro dos arquivos -dev ou -test.
spring.profiles.active=dev

# Database Configuration - SQLite
spring.datasource.url=jdbc:sqlite:./a3-20.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging
logging.level.org.springframework=INFO
logging.level.br.com.projetoA3=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Internationalization (i18n)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Timezone
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ==========================================
# NOVAS CONFIGURACOES - HELP DESK A3-2.0
# ==========================================

# Internacionalizacao e Locale (Forcar PT-BR em todo o sistema e validacoes)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Configuracoes de E-mail (SMTP)
# Exemplo configurado para Gmail. Altere para o servidor do seu cliente se necessario.
# Lembre-se de usar "Senhas de App" se o provedor exigir autenticacao de dois fatores.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.debug=false
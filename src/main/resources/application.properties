# =====================================================
# CONFIGURAÇÃO GERAL E PERFIS
# =====================================================
spring.application.name=a3-2-0
# Define o perfil de desenvolvimento como padrão
spring.profiles.active=dev

# =====================================================
# DATABASE - SQLite (Configurações Core)
# =====================================================
# Mantendo os pragmas WAL e synchronous=NORMAL para suporte a concorrência
spring.datasource.url=jdbc:sqlite:a3_projeto.db?journal_mode=WAL&synchronous=NORMAL&foreign_keys=ON
spring.datasource.driver-class-name=org.sqlite.JDBC

# =====================================================
# HIKARI CP - OTIMIZAÇÃO DE PERFORMANCE (POOL)
# =====================================================
# ✅ CORREÇÃO CRÍTICA: Aumentando pool para suportar múltiplos usuários
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Define timeout de 30 segundos para evitar locks infinitos
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON;

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# ✅ SEGURANÇA: Desabilita Open Session in View para evitar vazamento de recursos
spring.jpa.open-in-view=false

# =====================================================
# CONFIGURAÇÕES DE E-MAIL (Variáveis de Ambiente)
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Uso de variáveis de ambiente para segurança em produção
spring.mail.username=${MAIL_USERNAME:admin}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true